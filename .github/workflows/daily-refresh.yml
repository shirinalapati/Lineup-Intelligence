name: Daily lineup refresh

# Pulls newly completed 2026 games, evaluates them, and commits updated
# data/ artifacts back to main so clones stay current.

on:
  schedule:
    # 14:30 UTC ≈ 7:30am PT / 10:30am ET
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lineup-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Stop after World Series window
        run: |
          today=$(date -u +%F)
          if [[ "$today" > "2026-11-05" ]]; then
            echo "Past 2026-11-05 — skipping season refresh"
            echo "skip=1" >> "$GITHUB_ENV"
          else
            echo "skip=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.skip != '1'

      - uses: actions/setup-python@v5
        if: env.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.skip != '1'
        run: pip install -r requirements.txt

      - name: Refresh lineups and precompute
        if: env.skip != '1'
        run: PYTHONPATH=backend python scripts/daily_refresh.py --workers 2

      - name: Commit and push data updates
        if: env.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily lineup refresh $(date -u +%F)"
          git push
