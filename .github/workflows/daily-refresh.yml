name: Daily lineup refresh

# Pulls newly completed 2026 games, evaluates them, and commits updated
# data/ artifacts back to main so clones stay current.

on:
  schedule:
    # 14:30 UTC ≈ 7:30am PT / 10:30am ET
    - cron: "30 14 * * *"
    # Second attempt later in case MLB Stats API is unhealthy at first run
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lineup-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Stop after World Series window
        run: |
          today=$(date -u +%F)
          if [[ "$today" > "2026-11-05" ]]; then
            echo "Past 2026-11-05 — skipping season refresh"
            echo "skip=1" >> "$GITHUB_ENV"
          else
            echo "skip=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.skip != '1'

      - uses: actions/setup-python@v5
        if: env.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.skip != '1'
        run: pip install -r requirements.txt

      - name: Refresh lineups and precompute
        if: env.skip != '1'
        run: |
          set -euo pipefail
          # MLB Stats API is often flaky mid-morning. Retry the whole refresh a
          # few times before giving up; roster failures inside the script are
          # already non-fatal so lineups/evaluations can still commit.
          attempt=1
          max_attempts=3
          while true; do
            echo "::group::Refresh attempt ${attempt}/${max_attempts}"
            if PYTHONPATH=backend python scripts/daily_refresh.py --workers 2; then
              echo "::endgroup::"
              break
            fi
            status=$?
            echo "::endgroup::"
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "Refresh failed after ${max_attempts} attempts (exit ${status})"
              exit "$status"
            fi
            sleep_s=$(( attempt * 90 ))
            echo "Attempt ${attempt} failed; retrying in ${sleep_s}s..."
            sleep "$sleep_s"
            attempt=$(( attempt + 1 ))
          done

      - name: Commit and push data updates
        if: env.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily lineup refresh $(date -u +%F)"
          git push
